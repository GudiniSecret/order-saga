spring:
  # Общие параметры приложения
  application:
    name: order-service

  # Настройки подключения к БД
  datasource:
    url: jdbc:postgresql://localhost:5434/orders
    username: order
    password: order

  # Настройка работы с ORM
  jpa:
    open-in-view: false # Сессия Hibernate закрывается вместе с транзакцией сервиса, а не держится до конца HTTP-запроса; lazy-загрузка вне сервиса падает сразу
    hibernate:
      ddl-auto: validate # validate - Hibernate только проверяет соответствие Java-сущностей с структурой БД

  flyway:
    validate-migration-naming: true

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all # ответ записано только после подтверждения от всех in-sync реплик
      properties:
        max.block.ms: 5000         # сколько send() может ждать метаданные брокера
        request.timeout.ms: 5000   # таймаут одного запроса к брокеру
        delivery.timeout.ms: 10000 # общий лимит на доставку с ретраями, после него future завершается ошибкой

# Мониторинг и метрики
management:
  endpoint:
    health:
      show-details: always # Настраивает эндпойнт проверки приложения. Always - всегда показывать подробную инфу о состоянии системы

# Логирование, чтобы видеть, какие SQL запросы делает Hibernate
logging:
  level:
    org.hibernate.SQL: debug